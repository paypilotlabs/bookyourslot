# BookYourSlot production stack: Caddy (HTTPS) -> app (Next.js standalone) -> Postgres.
# Run from this directory with a filled-in .env (see .env.production.example).
# The app image is built ON the server from the repo checkout (needs ~4 GB free
# RAM during builds — see README for the swapfile step).

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No published ports on purpose — only the app reaches Postgres.

  calcom:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WEBAPP_URL: ${NEXT_PUBLIC_WEBAPP_URL}
        NEXT_PUBLIC_WEBSITE_TERMS_URL: ${NEXT_PUBLIC_WEBSITE_TERMS_URL}
        NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL: ${NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL}
        CALCOM_TELEMETRY_DISABLED: ${CALCOM_TELEMETRY_DISABLED}
        DATABASE_URL: ${DATABASE_URL}
        # Must be identical at build time and runtime — same .env feeds both.
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
        MAX_OLD_SPACE_SIZE: "4096"
    restart: unless-stopped
    env_file: .env
    environment:
      # start.sh waits for this host before running prisma migrate deploy
      DATABASE_HOST: database:5432
    depends_on:
      database:
        condition: service_healthy
    # No published ports — traffic comes in only through Caddy on the
    # internal network (the image EXPOSEs 3000 and has its own healthcheck).

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - calcom

volumes:
  database-data:
  caddy-data:
  caddy-config:
