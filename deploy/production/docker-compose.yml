# BookYourSlot production stack: existing Traefik -> app (Next.js standalone) -> Postgres.
# This VPS already runs Traefik (host network, letsencrypt resolver) in front of
# other apps, so we register the app as a Traefik-labeled service instead of
# running our own proxy. Run from this dir with a filled-in .env.

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - database-data:/var/lib/postgresql/data
    networks: [bys]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No published ports — only the app reaches Postgres.

  bookyourslot:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WEBAPP_URL: ${NEXT_PUBLIC_WEBAPP_URL}
        NEXT_PUBLIC_WEBSITE_TERMS_URL: ${NEXT_PUBLIC_WEBSITE_TERMS_URL}
        NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL: ${NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL}
        CALCOM_TELEMETRY_DISABLED: ${CALCOM_TELEMETRY_DISABLED}
        DATABASE_URL: ${DATABASE_URL}
        # Must be identical at build time and runtime — same .env feeds both.
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
        MAX_OLD_SPACE_SIZE: "4096"
    restart: unless-stopped
    env_file: .env
    environment:
      # start.sh waits for this host before running prisma migrate deploy
      DATABASE_HOST: database:5432
      NEXT_PUBLIC_WEBAPP_URL: ${NEXT_PUBLIC_WEBAPP_URL}
    depends_on:
      database:
        condition: service_healthy
    # Licensed brand fonts are gitignored, so they are absent from any image CI
    # builds from the repo. That was invisible while the server built its own
    # image (the scp'd files were sitting in the working tree); switching to the
    # GHCR image dropped them and the headline face silently fell back.
    # Mounting the host directory keeps the binaries off GitHub and needs no
    # rebuild. If the directory is empty the CSS just 404s and falls back, which
    # is the documented behaviour, so this is safe on a fresh clone.
    volumes:
      - ../../apps/web/public/fonts/brand:/calcom/apps/web/public/fonts/brand:ro
    networks: [bys]
    # No published ports — the existing Traefik reaches the app on the `bys`
    # bridge and terminates TLS. Host-network Traefik needs the network label to
    # pick which IP to route to.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bys"

      # --- middlewares ---------------------------------------------------
      # getIP() (packages/lib/getIP.ts:22-33) reads cf-connecting-ip and
      # true-client-ip BEFORE x-forwarded-for, and nothing on this box sets
      # them, so any client can forge one and mint a fresh identity per
      # request. Traefik already deletes and rewrites X-Forwarded-For and
      # X-Real-Ip at the entrypoint, so removing these two leaves getIP()
      # reading a header Traefik controls. An EMPTY label value deletes the
      # header; a non-empty one would set it.
      - "traefik.http.middlewares.bys-scrub-ip.headers.customrequestheaders.Cf-Connecting-Ip="
      - "traefik.http.middlewares.bys-scrub-ip.headers.customrequestheaders.True-Client-Ip="

      # Login, signup, password reset, magic link. One shared bucket per source
      # IP on purpose: switching from password spraying to signup spam must not
      # buy a fresh budget. burst=8 covers the worst honest case, a 2FA login
      # (two POSTs) with a fumbled password and a fumbled code.
      - "traefik.http.middlewares.bys-rl-auth.ratelimit.average=15"
      - "traefik.http.middlewares.bys-rl-auth.ratelimit.period=1m"
      - "traefik.http.middlewares.bys-rl-auth.ratelimit.burst=8"

      # Booking creation writes to the DB, the calendar, and sends mail to
      # attacker-chosen addresses. Uncapped it is an open relay; this bounds it
      # at 20 outbound emails per minute per source.
      - "traefik.http.middlewares.bys-rl-book.ratelimit.average=20"
      - "traefik.http.middlewares.bys-rl-book.ratelimit.period=1m"
      - "traefik.http.middlewares.bys-rl-book.ratelimit.burst=10"

      # Username availability. useDebounce(username, 600) means a typist who
      # pauses over 600ms between keys legitimately fires one request PER
      # CHARACTER, so a genuine signup can be ~50 requests. This is a cost cap
      # on an unauthenticated query, not an anti-enumeration control: public
      # profile pages at /<username> already reveal which handles are taken.
      - "traefik.http.middlewares.bys-rl-username.ratelimit.average=120"
      - "traefik.http.middlewares.bys-rl-username.ratelimit.period=1m"
      - "traefik.http.middlewares.bys-rl-username.ratelimit.burst=30"

      # --- routers ---------------------------------------------------------
      # Catch-all, unchanged apart from the header scrub. Deliberately NOT rate
      # limited: one page load pulls 30-80 requests, so any budget that
      # survives it is too loose to be worth having.
      - "traefik.http.routers.bys.rule=Host(`bookyourslot.online`) || Host(`www.bookyourslot.online`)"
      - "traefik.http.routers.bys.entrypoints=websecure"
      - "traefik.http.routers.bys.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bys.middlewares=bys-scrub-ip"
      - "traefik.http.routers.bys.service=bys"

      # Exact Path() only. PathPrefix(`/api/auth`) would also catch
      # /api/auth/session, which SessionProvider refetches on every window
      # focus, and /api/auth/csrf, which every signIn() fetches first —
      # throttling those breaks browsing for signed-in users.
      - "traefik.http.routers.bys-auth.rule=(Host(`bookyourslot.online`) || Host(`www.bookyourslot.online`)) && (Path(`/api/auth/callback/credentials`) || Path(`/api/auth/signup`) || Path(`/api/auth/forgot-password`) || Path(`/api/auth/reset-password`) || Path(`/api/auth/signin/email`))"
      - "traefik.http.routers.bys-auth.entrypoints=websecure"
      - "traefik.http.routers.bys-auth.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bys-auth.priority=100"
      - "traefik.http.routers.bys-auth.middlewares=bys-scrub-ip,bys-rl-auth"
      - "traefik.http.routers.bys-auth.service=bys"

      - "traefik.http.routers.bys-book.rule=(Host(`bookyourslot.online`) || Host(`www.bookyourslot.online`)) && (Path(`/api/book/event`) || Path(`/api/book/recurring-event`))"
      - "traefik.http.routers.bys-book.entrypoints=websecure"
      - "traefik.http.routers.bys-book.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bys-book.priority=100"
      - "traefik.http.routers.bys-book.middlewares=bys-scrub-ip,bys-rl-book"
      - "traefik.http.routers.bys-book.service=bys"

      # PathPrefix, deliberately, not Path. tRPC batches procedures into the URL:
      # /api/trpc/auth/sendVerifyEmailCode,verifyCodeUnAuthenticated?batch=1 is one
      # request that runs both, and an exact Path() match would let it straight
      # through. sendVerifyEmailCode is a publicProcedure that sends mail to an
      # arbitrary address, and nothing else throttles it — the in-app limiter is a
      # permissive stub without UNKEY_ROOT_KEY. The auth router is all mutations
      # with no queries, so no page load or session poll touches this prefix.
      - "traefik.http.routers.bys-trpc-auth.rule=(Host(`bookyourslot.online`) || Host(`www.bookyourslot.online`)) && PathPrefix(`/api/trpc/auth/`)"
      - "traefik.http.routers.bys-trpc-auth.entrypoints=websecure"
      - "traefik.http.routers.bys-trpc-auth.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bys-trpc-auth.priority=100"
      - "traefik.http.routers.bys-trpc-auth.middlewares=bys-scrub-ip,bys-rl-auth"
      - "traefik.http.routers.bys-trpc-auth.service=bys"

      - "traefik.http.routers.bys-username.rule=(Host(`bookyourslot.online`) || Host(`www.bookyourslot.online`)) && Path(`/api/username`)"
      - "traefik.http.routers.bys-username.entrypoints=websecure"
      - "traefik.http.routers.bys-username.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bys-username.priority=100"
      - "traefik.http.routers.bys-username.middlewares=bys-scrub-ip,bys-rl-username"
      - "traefik.http.routers.bys-username.service=bys"

      - "traefik.http.services.bys.loadbalancer.server.port=3000"
    # ponytail: www and apex both serve the app; canonical tags handle SEO.
    # Add a www->apex redirect middleware only if the duplicate host matters.
    #
    # rateLimit is left without a sourceCriterion on purpose: the default keys
    # on the TCP remote address, which the client cannot forge. Do NOT add
    # sourcecriterion.requestheadername or ipstrategy.depth here — there is no
    # CDN in front of this box, so a header-based key would be spoofable. If
    # Cloudflare is ever put in front, that changes and both must be revisited
    # together with a firewall limiting 80/443 to the CDN ranges.
    #
    # Every router names service=bys explicitly. Traefik only auto-assigns when
    # a container defines exactly one service; the moment a second appears it
    # drops every router that lacks one, and the whole site 404s.

networks:
  bys:
    name: bys

volumes:
  database-data:
