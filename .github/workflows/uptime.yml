name: Uptime

# Off-box uptime check. Everything else that watches this app runs ON the VPS,
# so it all dies with the VPS. This runs on GitHub's infrastructure and alerts
# through the same Telegram bot the deploy workflow already uses.
#
# COST, because this is a PRIVATE repo and Actions minutes are billed:
#   Every job is billed rounded up to a whole minute, so checks/month is also
#   roughly minutes/month. The GitHub Free allowance is 2000 minutes/month, and
#   CI (~15 min) plus Deploy (~20 min) already spend a chunk of it.
#     hourly       ->  ~720 min/month   (the setting below)
#     every 30 min -> ~1440 min/month   (72% of the whole allowance)
#     every 5 min  -> ~8640 min/month   (4x over; would cost real money)
#
#   To get 5-minute checks for free, copy this file into a PUBLIC repo and set
#   the cron to '*/5 * * * *'. Standard runners are free and unmetered on public
#   repos, and nothing here is secret - the URL is a public booking page and the
#   Telegram credentials come from that repo's own secrets.
#
# Scheduled runs are best-effort: GitHub delays them under load, and in practice the
# delay is far worse than the 10-20 minutes usually quoted. Measured gaps between the
# last eighteen runs of this workflow ranged from 2.3 to 6.5 hours despite an hourly
# cron. Treat this as "it has been down since last night", never as "down 4 minutes",
# and do not quote an uptime figure to a customer on the strength of it.
#
# TWO NOTIFICATIONS PER FAILURE, BY DESIGN. The job exits non-zero at the end so an
# outage is also visible in the Actions tab, which means GitHub emails you as well as
# the Telegram message below. Keeping the run red is worth more than the quiet, since
# it is the only outage history that exists. To silence just the email, use GitHub
# Settings, Notifications, Actions and untick email for failed workflows.

on:
  schedule:
    - cron: "17 * * * *" # hourly. Not on the hour: those minutes are the most contended.
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test message to Telegram instead of probing. Proves alerts reach your phone."
        type: boolean
        default: false

concurrency:
  group: uptime
  cancel-in-progress: false

# Nothing is read from or written to the repo.
permissions: {}

env:
  # A page that CANNOT render without a database read, so a 200 here proves
  # Postgres answered - these routes are server-rendered per request, and a dead
  # database makes them 500 rather than serve a stale copy.
  BOOKING_URL: https://bookyourslot.online/startwithleo/30min
  ROOT_URL: https://bookyourslot.online/
  # Deliberately NOT the event title. That is user-editable content: it was
  # "30 min meeting" on 20 Aug and "30 mins discussion" on 30 Aug, and keying on
  # it would page you for renaming your own event type. This string comes from
  # APP_NAME and is on every page. Its job is only to prove we reached the app
  # rather than a proxy or captive portal answering 200 with something else.
  KEYWORD: BookYourSlot
  # Seconds curl may spend on one probe, total, not just connecting.
  MAX_TIME: 20
  # Consecutive failures required before anyone is woken up.
  ATTEMPTS: 3

jobs:
  check:
    name: Probe production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No actions are used anywhere in this workflow - it is curl and shell.
      # Nothing to pin, nothing third-party in the supply chain.
      - name: Probe and alert
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          set -uo pipefail

          # An alerting path you have never fired is a guess. This sends a real
          # message down the real code path so you can confirm it reaches your
          # phone, without waiting for an actual outage to find out it does not.
          if [ "${TEST_ALERT:-false}" = "true" ]; then
            TEXT="$(printf '🧪 BookYourSlot uptime check - TEST\n\nThis is a drill. The monitor is working and alerts reach this chat.\nA real alert looks like this but starts with 🔴.\n\nSent: %s\n\n%s' \
              "$(date -u '+%Y-%m-%d %H:%M UTC')" "$RUN_URL")"
            if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
              echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are not set on this repo."
              exit 1
            fi
            curl -sS -m 15 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=${TEXT}" > /dev/null
            echo "Test alert sent. If it did not arrive, the bot token or chat id is wrong."
            exit 0
          fi

          # Prints a human reason and returns 1 on failure; silent on success.
          #
          # Records WHY a probe failed, not merely that it did. curl's phase timings are
          # what separate "the request never reached the box" from "the box answered too
          # slowly": tcp=0.000000s means no TCP connection was ever established, so the
          # fault is network or DNS rather than the application.
          #
          # This exists because of a real incident. On 2026-09-03 04:37 UTC this workflow
          # alerted, and afterwards the cause could not be determined: the server had not
          # restarted, had no resource pressure and showed no gap in its network counters,
          # yet nothing had recorded whether the connection arrived. Traefik on this host
          # runs with --log.level=WARN and no access log, and it is provisioned outside
          # this repository, so these timings are the only diagnostic available to us.
          probe() {
            url="$1"; want="$2"; rc=0; timing=""; code=""; detail=""
            # curl leaves the previous response in place when a request fails rather than
            # truncating it, verified against both a connect failure and a DNS failure. The
            # checks below return before the keyword grep on every failure path, so today
            # that cannot mislead us, but the consequence if the order were ever changed is
            # a down site reported healthy off a stale body. One line to make it impossible.
            : > /tmp/body
            timing=$(curl -sS --max-time "$MAX_TIME" -o /tmp/body \
              -w 'http=%{http_code} dns=%{time_namelookup}s tcp=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s' \
              "$url" 2>/tmp/err) || rc=$?

            if [ "$rc" -ne 0 ]; then
              detail=$(tr -d '\n' < /tmp/err | cut -c1-140)
              # curl exit 6 is name resolution. Worth its own line: it sends you to the
              # registrar or the DNS provider, not to the server.
              if [ "$rc" -eq 6 ]; then
                printf 'DNS did not resolve (curl exit 6: %s)%s' "$detail" "${timing:+ | $timing}"
                return 1
              fi
              # An empty timing means curl died before it could report anything at all.
              case "$timing" in
                ""|*"tcp=0.000000s"*)
                  printf 'never established a connection (curl exit %s: %s)%s' \
                    "$rc" "$detail" "${timing:+ | $timing}"
                  return 1 ;;
              esac
              # TCP is up, so the rest is about how far the exchange got. Only curl exit 28
              # is actually a timeout; an expired certificate (60), a handshake failure (35)
              # or a reset (56) all connect and then die in milliseconds. Calling those a
              # 20-second timeout would send whoever reads the alert after a hung app when
              # the real answer is the certificate or the proxy.
              if [ "$rc" -eq 28 ]; then
                printf 'connected, then failed to answer within %ss (curl exit 28: %s) | %s' \
                  "$MAX_TIME" "$detail" "$timing"
              else
                case "$timing" in
                  *"tls=0.000000s"*)
                    printf 'connected, but TLS never completed (curl exit %s: %s) | %s' \
                      "$rc" "$detail" "$timing" ;;
                  *)
                    printf 'connected, then the connection failed (curl exit %s: %s) | %s' \
                      "$rc" "$detail" "$timing" ;;
                esac
              fi
              return 1
            fi

            code=${timing#http=}; code=${code%% *}
            if [ "$code" != "200" ]; then
              printf 'returned HTTP %s | %s' "$code" "$timing"
              return 1
            fi
            if [ -n "$want" ] && ! grep -qF "$want" /tmp/body; then
              printf 'returned 200 but the page did not contain "%s" | %s' "$want" "$timing"
              return 1
            fi
            return 0
          }

          # Check the database-backed page first: it is the stronger signal and
          # covers the root implicitly. Only if it fails do we probe the root, to
          # tell "whole site down" apart from "app up, database down".
          # Three attempts. Two was not enough: the 2026-09-03 alert fired on a
          # disturbance that had cleared well before anyone read it, and a third attempt
          # would probably have caught the recovery and stayed quiet. With 20s and 40s
          # backoff the third probe starts between t+60s (failures that return instantly,
          # such as a reset or a 500) and t+100s (failures that burn the full MAX_TIME).
          # Every attempt is echoed so the job log carries the history even when the run
          # ends up passing.
          # The loop below is entry-conditional, so ATTEMPTS=0 or a typo would skip every
          # probe, leave FAILED empty and report the site healthy without ever contacting
          # it. A misconfigured monitor has to fail red. MAX_TIME needs no such guard: a
          # bad value makes curl error, which already surfaces as a failure.
          case "$ATTEMPTS" in
            ''|*[!0-9]*|0)
              echo "ATTEMPTS must be a positive integer, got '$ATTEMPTS'" >&2
              exit 1 ;;
          esac

          FAILED=""
          attempt=1
          while [ "$attempt" -le "$ATTEMPTS" ]; do
            if REASON=$(probe "$BOOKING_URL" "$KEYWORD"); then
              FAILED=""
              echo "attempt $attempt/$ATTEMPTS: ok"
              break
            fi
            FAILED="yes"
            echo "attempt $attempt/$ATTEMPTS failed: $REASON"
            [ "$attempt" -lt "$ATTEMPTS" ] && sleep $(( attempt * 20 ))
            attempt=$(( attempt + 1 ))
          done

          if [ -z "$FAILED" ]; then
            echo "healthy: $BOOKING_URL"
            exit 0
          fi

          if ROOT_REASON=$(probe "$ROOT_URL" "$KEYWORD"); then
            SCOPE="The site is up but its database-backed pages are not. Booking pages are down."
          else
            SCOPE="The whole site is unreachable (the root $ROOT_REASON)."
          fi

          TEXT="$(printf '🔴 BookYourSlot is DOWN\n\n%s\n\nProbe: %s\nDetail: %s\nChecked: %s\n\n%s' \
            "$SCOPE" "$BOOKING_URL" "$REASON" "$(date -u '+%Y-%m-%d %H:%M UTC')" "$RUN_URL")"

          echo "$TEXT"

          if [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ]; then
            curl -sS -m 15 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=${TEXT}" > /dev/null \
              && echo "Telegram alert sent." \
              || echo "Telegram alert FAILED to send (the outage above is still real)."
          else
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set - no alert sent."
          fi

          # Fail the job so the outage is also visible in the Actions tab, not
          # only in Telegram.
          exit 1
