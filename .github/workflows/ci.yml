name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo — no token write scope needed.
permissions:
  contents: read

jobs:
  quality:
    name: Types, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Build-time requirements. Placeholders for CI only: no real secret
      # belongs in this file, and none is needed to type-check or test.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/calendso
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/calendso
      NEXTAUTH_SECRET: ci-placeholder-secret
      CALENDSO_ENCRYPTION_KEY: ci-placeholder-encryption-key-32c
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:3000
      NEXT_PUBLIC_WEBSITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the lint step can diff against the base commit.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn type-check:ci --force

      - name: Lint changed files
        # The inherited Cal.diy tree carries thousands of pre-existing
        # diagnostics, so linting everything would keep this job permanently
        # red. Gate on what the change actually touches instead.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          echo "Linting files changed since $BASE"
          # biome exits 1 with "No files were processed in the specified paths"
          # when every changed file is a type it does not handle (.md, .sh, .yml).
          # That turns any docs-only or script-only PR red on a lint check that
          # found nothing to lint. Treat that one message as a pass; every real
          # diagnostic still fails the job. --files-ignore-unknown does not help,
          # the exit code is the same.
          set +e
          OUTPUT="$(yarn biome ci --changed --since="$BASE" . 2>&1)"
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -ne 0 ] && printf '%s' "$OUTPUT" | grep -q "No files were processed"; then
            echo "No biome-lintable files in this change; nothing to lint."
            exit 0
          fi
          exit "$STATUS"

      - name: Unit tests
        run: TZ=UTC yarn test

  build:
    name: Next build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Same CI-only placeholders as the quality job. The build reads these at
      # module scope in a few places and fails without them.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/calendso
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/calendso
      NEXTAUTH_SECRET: ci-placeholder-secret
      CALENDSO_ENCRYPTION_KEY: ci-placeholder-encryption-key-32c
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:3000
      NEXT_PUBLIC_WEBSITE_URL: http://localhost:3000
      NODE_OPTIONS: --max-old-space-size=6144

    # Deliberately a separate job, not a step in `quality`:
    #   - it runs in parallel, so it costs wall-clock time rather than adding to it
    #   - `next build` writes apps/web/.next, which contains compiled *.test.js
    #     files. In the same job those land in vitest's glob and the suite fails
    #     with "Page /api/book/recurring-event.test does not export a default
    #     function". Separate runners keep the build output away from the tests.
    #
    # This exists because type-check and tests cannot see a whole class of
    # failure. A lint auto-fix once added `import process from "node:process"` to
    # packages/lib/constants.ts, which is reachable from an edge-runtime route.
    # CI stayed green and main was unbuildable across three merges.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # Same order as the production Dockerfile. `next build` runs its own
      # TypeScript pass against the workspace's built output, so without the
      # trpc build it fails on the router types, and without
      # copy-app-store-static it cannot resolve the generated
      # public/app-store/svg-hashes.json the OG route imports. Keep these in
      # step with the Dockerfile - a build that does not match it does not
      # prove production builds.
      - name: Build dependencies
        run: |
          yarn workspace @calcom/trpc run build
          yarn --cwd packages/embeds/embed-core workspace @calcom/embed-core run build
          yarn --cwd apps/web workspace @calcom/web run copy-app-store-static

      - name: Build
        run: yarn --cwd apps/web workspace @calcom/web run build
