name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo — no token write scope needed.
permissions:
  contents: read

jobs:
  quality:
    name: Types, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Build-time requirements. Placeholders for CI only: no real secret
      # belongs in this file, and none is needed to type-check or test.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/calendso
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/calendso
      NEXTAUTH_SECRET: ci-placeholder-secret
      CALENDSO_ENCRYPTION_KEY: ci-placeholder-encryption-key-32c
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:3000
      NEXT_PUBLIC_WEBSITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the lint step can diff against the base commit.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn type-check:ci --force

      - name: Lint changed files
        # The inherited Cal.diy tree carries thousands of pre-existing
        # diagnostics, so linting everything would keep this job permanently
        # red. Gate on what the change actually touches instead.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          echo "Linting files changed since $BASE"
          # biome exits 1 with "No files were processed in the specified paths"
          # when every changed file is a type it does not handle (.md, .sh, .yml).
          # That turns any docs-only or script-only PR red on a lint check that
          # found nothing to lint. Treat that one message as a pass; every real
          # diagnostic still fails the job. --files-ignore-unknown does not help,
          # the exit code is the same.
          set +e
          OUTPUT="$(yarn biome ci --changed --since="$BASE" . 2>&1)"
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" -ne 0 ] && printf '%s' "$OUTPUT" | grep -q "No files were processed"; then
            echo "No biome-lintable files in this change; nothing to lint."
            exit 0
          fi
          exit "$STATUS"

      - name: Unit tests
        run: TZ=UTC yarn test
